# Orchestration for game_analysis_agent.
#
# Default startup is the CPU-only static dashboard. Optional profiles provide
# Replay, Godot tools, the legacy CLI, and NVIDIA local inference.
#
# Notes:
#   * SGLang v0.5.16 is the primary Qwen3.6 backend. Its hybrid Mamba
#     radix-cache path supports branching-point caching and MTP together.
#   * vLLM v0.26.0 remains available as the APC-only baseline/fallback.
#   * NVFP4 requires Blackwell (sm_100 / sm_120). Both engines expose the
#     same stable served model name so evidence records stay comparable.
#   * The agent service does NOT need GPU access — the inference endpoint
#     is plain HTTP. It also does not need the GPU driver / CUDA
#     stack; it's a normal slim Python image.

services:
  sglang:
    # Pinned 2026-07-25. v0.5.16 supports Qwen3.6, ModelOpt FP4, the
    # extra_buffer Mamba radix-cache strategy, and MTP/NEXTN decoding.
    image: lmsysorg/sglang:v0.5.16-cu130-runtime
    entrypoint: ["sh", "-c"]
    ports:
      - "${SGLANG_BIND_PORT:-30000}:30000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_ENABLE_HF_TRANSFER=${HF_HUB_ENABLE_HF_TRANSFER:-0}
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - LLM_MODEL=${LLM_MODEL:-nvidia/Qwen3.6-27B-NVFP4}
      - LLM_MAX_MODEL_LEN=${LLM_MAX_MODEL_LEN:-65536}
      - LLM_MAX_NUM_SEQS=${LLM_MAX_NUM_SEQS:-4}
      - LLM_SERVED_MODEL_NAME=${LLM_SERVED_MODEL_NAME:-qwen3.6-27b-nvfp4}
      - SGLANG_API_KEY=${SGLANG_API_KEY:-local-dev-token}
      - SGLANG_MEM_FRACTION_STATIC=${SGLANG_MEM_FRACTION_STATIC:-0.80}
      - SGLANG_MAMBA_CACHE_STRATEGY=${SGLANG_MAMBA_CACHE_STRATEGY:-extra_buffer}
      - SGLANG_PAGE_SIZE=${SGLANG_PAGE_SIZE:-64}
      - SGLANG_ENABLE_MTP=${SGLANG_ENABLE_MTP:-1}
      - SGLANG_SPEC_NUM_STEPS=${SGLANG_SPEC_NUM_STEPS:-3}
      - SGLANG_SPEC_TOPK=${SGLANG_SPEC_TOPK:-1}
      - SGLANG_SPEC_NUM_DRAFT_TOKENS=${SGLANG_SPEC_NUM_DRAFT_TOKENS:-4}
    ipc: host
    shm_size: '32gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - >-
        set -eu;
        set -- sglang serve
        --model-path "$${LLM_MODEL:-nvidia/Qwen3.6-27B-NVFP4}"
        --host 0.0.0.0
        --port 30000
        --api-key "$${SGLANG_API_KEY:-local-dev-token}"
        --served-model-name "$${LLM_SERVED_MODEL_NAME:-qwen3.6-27b-nvfp4}"
        --trust-remote-code
        --quantization modelopt_fp4
        --dtype bfloat16
        --reasoning-parser qwen3
        --tool-call-parser qwen3_coder
        --sampling-defaults model
        --context-length "$${LLM_MAX_MODEL_LEN:-65536}"
        --max-running-requests "$${LLM_MAX_NUM_SEQS:-4}"
        --mem-fraction-static "$${SGLANG_MEM_FRACTION_STATIC:-0.80}"
        --mamba-radix-cache-strategy "$${SGLANG_MAMBA_CACHE_STRATEGY:-extra_buffer}"
        --page-size "$${SGLANG_PAGE_SIZE:-64}";
        if [ "$${SGLANG_ENABLE_MTP:-1}" = "1" ]; then
        set -- "$$@"
        --speculative-algorithm NEXTN
        --speculative-num-steps "$${SGLANG_SPEC_NUM_STEPS:-3}"
        --speculative-eagle-topk "$${SGLANG_SPEC_TOPK:-1}"
        --speculative-num-draft-tokens "$${SGLANG_SPEC_NUM_DRAFT_TOKENS:-4}";
        fi;
        exec "$$@"
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, urllib.request, sys; req=urllib.request.Request('http://127.0.0.1:30000/v1/models', headers={'Authorization': 'Bearer ' + os.environ.get('SGLANG_API_KEY', 'local-dev-token')}); sys.exit(0 if urllib.request.urlopen(req, timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 600s
    restart: unless-stopped
    profiles:
      - local-nvidia
      - local-sglang

  vllm:
    # Pinned 2026-07-31: v0.26.0 contains fine-grained prefix matching for
    # aligned attention/Mamba hybrid caches. Hybrid APC remains experimental,
    # so it is an optimization only and must not affect correctness gates.
    image: vllm/vllm-openai:v0.26.0
    # The image keeps ENTRYPOINT=["vllm","serve"] — a plain
    # ``command`` would prepend ``vllm serve``, which then misreads
    # the next positional argument. Empty entrypoint lets the shell
    # script below run as-is. Verify after upgrade; if upstream changes
    # the entrypoint back to plain ``vllm``, drop the empty-string override.
    entrypoint: ""
    ports:
      - "${VLLM_BIND_PORT:-8000}:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      # vLLM's strict env-var validation warns about any ``VLLM_*``
      # variable it does not recognize. Whitelist only what vLLM itself
      # consumes; the Python client reads its config from the host's
      # .env (which is auto-loaded by ``analyse_agent.env.load_dotenv``)
      # so we don't need to forward ``VLLM_BASE_URL`` / ``VLLM_API_KEY``
      # into the container.
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_ENABLE_HF_TRANSFER=${HF_HUB_ENABLE_HF_TRANSFER:-0}
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - LLM_MODEL=${LLM_MODEL:-nvidia/Qwen3.6-27B-NVFP4}
      - LLM_MAX_MODEL_LEN=${LLM_MAX_MODEL_LEN:-65536}
      - LLM_MAX_NUM_SEQS=${LLM_MAX_NUM_SEQS:-4}
      - LLM_MAX_NUM_BATCHED_TOKENS=${LLM_MAX_NUM_BATCHED_TOKENS:-}
      - LLM_ENABLE_PREFIX_CACHING=${LLM_ENABLE_PREFIX_CACHING:-1}
      - LLM_MAMBA_CACHE_MODE=${LLM_MAMBA_CACHE_MODE:-align}
      - LLM_PREFIX_MATCH_UNIT=${LLM_PREFIX_MATCH_UNIT:-16}
      - LLM_ENABLE_MTP=${LLM_ENABLE_MTP:-0}
      - LLM_MTP_NUM_SPECULATIVE_TOKENS=${LLM_MTP_NUM_SPECULATIVE_TOKENS:-3}
      - LLM_GPU_MEMORY_UTILIZATION=${LLM_GPU_MEMORY_UTILIZATION:-0.9}
      - LLM_SERVED_MODEL_NAME=${LLM_SERVED_MODEL_NAME:-qwen3.6-27b-nvfp4}
      - LLM_API_KEY=${VLLM_API_KEY:-local-dev-token}
    ipc: host
    shm_size: '32gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Default model is NVIDIA's official NVFP4 quant
    # (``nvidia/Qwen3.6-27B-NVFP4``). Override with LLM_MODEL.
    # APC is on by default with 16-token matching inside the larger physical
    # hybrid-cache blocks. MTP is intentionally off: enable it only for a
    # bounded long-output benchmark after correctness and soak gates pass.
    #
    # The sh wrapper does shell-side substitution so the JSON for
    # --speculative-config can be emitted literally. We avoid YAML
    # block scalars (``|``) because Compose only interpolates
    # ``$$`` -> ``$`` inside flow-style scalars.
    command:
      - sh
      - -c
      - >-
        MODEL="$${LLM_MODEL:-nvidia/Qwen3.6-27B-NVFP4}";
        ARGS="$${MODEL} --host 0.0.0.0 --port 8000 --api-key $${LLM_API_KEY:-local-dev-token} --served-model-name $${LLM_SERVED_MODEL_NAME:-qwen3.6-27b-nvfp4} --trust-remote-code --quantization modelopt --reasoning-parser qwen3 --generation-config vllm --dtype bfloat16 --gpu-memory-utilization $${LLM_GPU_MEMORY_UTILIZATION:-0.9} --max-model-len $${LLM_MAX_MODEL_LEN:-65536} --max-num-seqs $${LLM_MAX_NUM_SEQS:-4} --language-model-only";
        if [ -n "$${LLM_MAX_NUM_BATCHED_TOKENS:-}" ]; then
        ARGS="$${ARGS} --max-num-batched-tokens $${LLM_MAX_NUM_BATCHED_TOKENS}";
        fi;
        if [ "$${LLM_ENABLE_PREFIX_CACHING:-1}" = "1" ]; then
        ARGS="$${ARGS} --enable-prefix-caching --mamba-cache-mode $${LLM_MAMBA_CACHE_MODE:-align} --prefix-match-unit $${LLM_PREFIX_MATCH_UNIT:-16}";
        else
        ARGS="$${ARGS} --no-enable-prefix-caching";
        fi;
        if [ "$${LLM_ENABLE_MTP:-0}" = "1" ]; then
        ARGS="$${ARGS} --speculative-config {\"method\":\"mtp\",\"num_speculative_tokens\":$${LLM_MTP_NUM_SPECULATIVE_TOKENS:-3}}";
        fi;
        exec vllm serve $${ARGS}
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, urllib.request, sys; req=urllib.request.Request('http://127.0.0.1:8000/v1/models', headers={'Authorization': 'Bearer ' + os.environ.get('LLM_API_KEY', 'local-dev-token')}); sys.exit(0 if urllib.request.urlopen(req, timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 600s
    restart: unless-stopped
    profiles:
      - local-vllm

  godot:
    # Long-running tool sidecar. scripts/godot-docker-wrapper uses
    # `docker compose exec` when this service is up and falls back to an
    # equivalent one-shot `docker run` otherwise.
    image: ${GODOT_DOCKER_IMAGE:-barichello/godot-ci:4.4}
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec sleep infinity"]
    environment:
      HOME: /tmp/game-analysis-godot-home
    volumes:
      # Mount the parent of this repository at the identical host path.
      # The runner passes absolute game --path and Agent report --out paths.
      # Set GODOT_DOCKER_MOUNT_ROOT to the parent directory that contains
      # game_analysis_agent before `compose up`; the game demo is embedded.
      # The fallback below is /tmp so the service can still start on a
      # clean machine, but it is only useful for syntax / healthcheck checks
      # — real game runs need the project tree mounted here.
      - ${GODOT_DOCKER_MOUNT_ROOT:-/tmp}:${GODOT_DOCKER_MOUNT_ROOT:-/tmp}
      - /tmp:/tmp
    working_dir: /tmp
    init: true
    healthcheck:
      test: ["CMD", "godot", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    profiles:
      - game-tools

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.judge
    entrypoint: ["/app/.venv/bin/python", "tools/judge/run_judge_api.py"]
    command: ["--host", "0.0.0.0", "--port", "8080", "--frontend", "/app/frontend/dist"]
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_PERSONA_MODEL=${OPENAI_PERSONA_MODEL:-gpt-5.6-luna}
    ports:
      - "${JUDGE_PORT:-8080}:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/provider-status', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  replay:
    build:
      context: .
      dockerfile: Dockerfile.judge
    command: ["--mode", "replay", "--offline", "--json", "--output-dir", "-"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    profiles:
      - judge

  agent:
    # Built from the Dockerfile in this repo. This container is intended for
    # pure-Python analysis/QA commands. Gameplay commands run on the host with
    # GODOT_BIN=scripts/godot-docker-wrapper so they can exec the sidecar.
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Keep host URLs (localhost) separate from compose-network URLs.
      # The latter must use service DNS names from inside this container.
      - LLM_PROVIDER=${LLM_PROVIDER:-sglang}
      - SGLANG_BASE_URL=${AGENT_SGLANG_BASE_URL:-http://sglang:30000/v1}
      - SGLANG_API_KEY=${SGLANG_API_KEY:-local-dev-token}
      - SGLANG_MODEL=${SGLANG_MODEL:-qwen3.6-27b-nvfp4}
      - VLLM_BASE_URL=${AGENT_VLLM_BASE_URL:-http://vllm:8000/v1}
      - VLLM_API_KEY=${VLLM_API_KEY:-local-dev-token}
      - PERSONA_ENABLE_THINKING=${PERSONA_ENABLE_THINKING:-1}
      - PERSONA_DECISION_MAX_TOKENS=${PERSONA_DECISION_MAX_TOKENS:-2048}
      - PERSONA_EVENT_MAX_TOKENS=${PERSONA_EVENT_MAX_TOKENS:-64}
      - GAME_PROJECT_PATH=${GAME_PROJECT_PATH:-/app/demo/study-in-germany}
    volumes:
      # Reports are persisted back onto the host for inspection.
      - ./reports:/app/reports
    profiles:
      - cli
    # No long-running process — the CLI exits when it finishes.
    command: ["python", "tools/gameplay/run_gameplay_agent.py", "--help"]

# A bare ``docker compose up`` starts only the CPU dashboard. Use profile
# ``judge`` for offline Replay, ``game-tools`` for Godot, ``cli`` for the legacy
# agent, ``local-nvidia``/``local-sglang`` for the primary SGLang backend, and
# ``local-vllm`` for the retained baseline.
